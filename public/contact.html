<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Contact — Explore Karnataka</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">Explore<span>Karnataka</span></div>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <section>
    <div class="form-wrapper">
      <h2>Get in Touch</h2>
      <form id="contact-form" novalidate>
        <div class="form-group">
          <label>Name</label>
          <input type="text" name="name" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea name="message" rows="5" placeholder="Tell us about your trip…"></textarea>
        </div>
        <button class="btn" type="submit">Send Message</button>
        <p id="form-msg" class="form-msg"></p>
      </form>
    </div>
  </section>

  <footer>© 2026 <span>Explore Karnataka</span></footer>
  <script src="js/script.js"></script>
</body>
</html>
