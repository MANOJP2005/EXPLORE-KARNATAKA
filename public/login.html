<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Login — Explore Karnataka</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">Explore<span>Karnataka</span></div>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="active">Login</a></li>
    </ul>
  </nav>

  <section>
    <div class="form-wrapper">
      <h2>Welcome Back</h2>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" />
        </div>
        <button class="btn" type="submit">Login</button>
        <p id="form-msg" class="form-msg"></p>
        <p class="form-link">No account? <a href="register.html">Register here</a></p>
      </form>
    </div>
  </section>

  <footer>© 2026 <span>Explore Karnataka</span></footer>
  <script src="js/script.js"></script>
</body>
</html>
